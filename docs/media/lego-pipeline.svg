<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="500" viewBox="0 0 1360 500" role="img" aria-labelledby="title desc">
  <title id="title">Darius: a manual is a program</title>
  <desc id="desc">Original architecture illustration showing a studded brick tower, its geometric support graph, and the progression from assembly intent through compilation and synthetic data to a learning baseline.</desc>
