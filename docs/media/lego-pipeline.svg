    <text x="54" y="141" font-size="64" font-weight="700" letter-spacing="-3">A manual</text>
    <text x="54" y="211" font-size="64" font-weight="700" letter-spacing="-3">is a program.</text>
    <text x="57" y="257" font-size="18" fill="#686b66">Make every part, connection and next move explicit.</text>
