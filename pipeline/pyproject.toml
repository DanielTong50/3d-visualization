[project]
name = "darius"
version = "0.2.0"
description = "Compile a phone video of a tabletop into a simulation-ready digital twin for robotics."
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "coacd==1.0.14",
    "fastapi==0.162.0",
    "meta-sam-parser==0.1.0",
    "modal==1.6.2",
    "numpy==2.4.6",
    "openai==3.39.0",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "scipy==1.17.1",
    "spz",
]

[project.scripts]
darius = "darius.cli:main"

[project.optional-dependencies]
# The MuJoCo environment (darius.robotics.sim); the exporters themselves need nothing extra.
sim = ["mujoco==3.17.0"]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
    "mujoco==3.17.0",
    "pytest==8.4.2",
    "ruff==0.14.2",
    "usd-core==26.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B008"]  # FastAPI declares parameters with File(...) defaults

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darius"]

[tool.uv.sources]
spz = { git = "https://github.com/nianticlabs/spz.git", rev = "affd0ecea7fbb4c265ee119475af7ee5b2997482" }
