name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Python (lint, tests, scene contract, MuJoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q   # includes MuJoCo and OpenUSD round trips of every exported scene
      - name: Shipped scenes satisfy the contract
        run: uv run darius validate ../scenes/*/
      - name: Robotics annotations, bundles and the gallery index are current
        run: uv run darius gallery --check
      - name: Every shipped scene comes to rest in MuJoCo
        run: for scene in ../scenes/*/; do uv run darius sim "$scene" || exit 1; done

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
