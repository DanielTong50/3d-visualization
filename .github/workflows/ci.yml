name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Engine (LEGO compiler, data, model, simulation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra manuals --extra simulation
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: LEGO source, plans and training bundles match the compiler
        run: |
          uv run darius lego export
          git diff --exit-code -- ../assemblies/lego
      - name: Synthetic reference data trains the CPU sanity baseline
        run: |
          uv run darius lego dataset signal-tower --out outputs/ci-data --episodes 4 --seed 7
          uv run python -m darius.robotics.train outputs/ci-data --out outputs/ci-baseline
          uv run darius lego sim bridge --out outputs/ci-bridge.xml
      - name: Every library plan is valid
        run: uv run darius validate ../assemblies/*/plan.json
      - name: The exported library matches the catalog
        run: |
          uv run darius export
          git diff --exit-code -- ../assemblies/index.json ../assemblies/*/plan.json
      - name: Stored model results re-score to the published numbers (no API calls)
        run: uv run darius eval --check

  web:
    name: Web (format, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
