[project]
name = "darius"
version = "1.3.0"
description = "An assembly copilot: manuals become assembly graphs, builds are tracked from a phone camera, the next move is shown in AR."
license = "MIT"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.162.0",
    "meta-sam-parser==0.1.0",
    "modal==1.6.2",
    "numpy==2.4.6",
    "openai==3.39.0",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
]

[project.scripts]
darius = "darius.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["B008"]  # FastAPI declares parameters with File(...) defaults

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darius"]

